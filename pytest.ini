[pytest]
# Add backend/ to sys.path so tests can import main, embedder, indexer, catalog
pythonpath = backend

# Default test discovery
testpaths = tests

# Async mode (for future async tests)
asyncio_mode = auto

# Only show WARNING and above from app code (suppress DEBUG noise)
log_cli = true
log_cli_level = WARNING
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S

# Short traceback format
addopts = -ra --tb=short

# Filter known warnings from third-party libs
filterwarnings =
    ignore::DeprecationWarning:torch.*
    ignore::DeprecationWarning:torchvision.*
    ignore::UserWarning:torchvision.*
