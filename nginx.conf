# ─────────────────────────────────────────────────────────────────────────────
# nginx.conf — VisualFind Frontend (Docker)
# ─────────────────────────────────────────────────────────────────────────────
# Serves the static frontend on port 80.
# Proxies /api/* requests to the FastAPI backend container.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── Static frontend files ─────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Simple health endpoint for Docker HEALTHCHECK ─────────────────────────
    location /health.txt {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Proxy API calls to the FastAPI backend ────────────────────────────────
    # When running in docker-compose the backend service is named "backend"
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;

        # Allow large image uploads (up to 20 MB)
        client_max_body_size 20M;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
